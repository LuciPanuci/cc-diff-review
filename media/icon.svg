<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="128" height="128" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- top half: removed (red) -->
    <rect x="0" y="0" width="128" height="64" fill="#D64545"/>
    <!-- bottom half: added (green) -->
    <rect x="0" y="64" width="128" height="64" fill="#3FA65C"/>
    <!-- seam between deleted and inserted -->
    <rect x="0" y="62" width="128" height="4" fill="#000000" opacity="0.18"/>

    <!-- ===== removed rows (− marker + struck-through code line) ===== -->
    <g fill="#FFFFFF">
      <!-- row 1 -->
      <rect x="16" y="21.5" width="16" height="5" rx="2.5"/>
      <rect x="44" y="19" width="60" height="8" rx="4" opacity="0.9"/>
      <!-- row 2 -->
      <rect x="16" y="43.5" width="16" height="5" rx="2.5"/>
      <rect x="44" y="41" width="42" height="8" rx="4" opacity="0.9"/>
    </g>

    <!-- ===== added rows (+ marker + code line) ===== -->
    <g fill="#FFFFFF">
      <!-- row 1 -->
      <rect x="16" y="79.5" width="16" height="5" rx="2.5"/>
      <rect x="21.5" y="74" width="5" height="16" rx="2.5"/>
      <rect x="44" y="77" width="54" height="8" rx="4" opacity="0.9"/>
      <!-- row 2 -->
      <rect x="16" y="101.5" width="16" height="5" rx="2.5"/>
      <rect x="21.5" y="96" width="5" height="16" rx="2.5"/>
      <rect x="44" y="99" width="66" height="8" rx="4" opacity="0.9"/>
    </g>
  </g>
</svg>
